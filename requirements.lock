# Generado con: python -m pip freeze > requirements.lock
#
# El conjunto exacto de versiones con el que la suite pasa. requirements.txt
# declara QUE se necesita y con que rangos; este fichero declara CON QUE se
# probo. Los dos hacen falta: el rango dice lo que el proyecto tolera, el lock
# dice lo que se ejecuto de verdad.
#
# Instalar aqui:  pip install -r requirements.lock
# Regenerar:      pip install -r requirements-dev.txt && pip freeze > requirements.lock
#
# Incluye las transitivas de fastmcp a proposito: un lock que solo fija lo
# declarado no fija nada: fastmcp arrastra 80 paquetes y cualquiera de ellos
# puede cambiar bajo un rango que no controlamos.
